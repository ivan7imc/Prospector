<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospector</title>
<style>
:root { --bg:#fff; --fg:#1a1a1a; --mut:#777; --line:#e4e4e4; --ok:#0a7d33; --acc:#1652d9; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#101014; --fg:#e8e8e8; --mut:#999; --line:#2a2a30; --ok:#4cc472; --acc:#7aa2ff; }
}
* { box-sizing:border-box; margin:0 }
body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif;
       max-width:680px; margin:0 auto; padding:40px 16px }
h1 { font-size:1.5rem; margin-bottom:4px } h1 span{color:var(--acc)}
.sub { color:var(--mut); font-size:.9rem; margin-bottom:24px }
form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px }
input { flex:1; min-width:140px; padding:10px 12px; font:inherit;
        border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg) }
button { padding:10px 20px; font:inherit; border:0; border-radius:8px;
         background:var(--acc); color:#fff; cursor:pointer }
button:disabled { opacity:.5; cursor:wait }
#prog { display:none; margin-bottom:24px }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden }
.bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s }
#plog { color:var(--mut); font-size:.85rem; margin-top:6px; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis }
#resumo { display:none; gap:10px; margin-bottom:18px }
.pill { flex:1; text-align:center; border:1px solid var(--line); border-radius:10px; padding:10px }
.pill b { display:block; font-size:1.4rem }
.pill small { color:var(--mut) }
details { border:1px solid var(--line); border-radius:10px; margin-bottom:10px }
summary { padding:12px 14px; cursor:pointer; font-weight:600 }
.item { padding:10px 14px; border-top:1px solid var(--line); font-size:.92rem }
.item b .nota { color:var(--ok); font-weight:600 }
.item a { color:var(--acc); text-decoration:none; word-break:break-all }
.item .mut { color:var(--mut) }
#acoes { display:none; gap:8px; margin-top:16px }
#acoes button { flex:1; text-align:center; padding:10px; border:1px solid var(--line);
           border-radius:8px; color:var(--fg); background:transparent; cursor:pointer; font:inherit }
#acoes button:disabled { opacity:.5; cursor:wait }
#exportfb { display:none; margin-top:10px; font-size:.85rem; color:var(--mut) }
#exportfb .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
#exportfb .row b { color:var(--fg); word-break:break-all }
#exportfb .row button, #exportfb .row a { padding:6px 12px; font:inherit; border:1px solid var(--line);
  border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; text-decoration:none }
#exportfb textarea { display:none; width:100%; min-height:160px; margin-top:8px; font:12px/1.4 ui-monospace,monospace;
  background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px }
#erro { display:none; color:#c0392b; margin-bottom:16px }
</style>
</head>
<body>
<h1>🔎 Prospec<span>tor</span></h1>
<p class="sub">nicho + cidade → presença digital dos negócios locais (via Google Maps)</p>

<form id="f">
  <input id="nicho" placeholder="pizzaria" required>
  <input id="cidade" placeholder="Poços de Caldas" required>
  <button id="go">Prospectar</button>
</form>

<div id="erro"></div>
<div id="prog"><div class="bar"><i id="fill"></i></div><div id="plog"></div></div>
<div id="resumo" style="display:none"></div>
<div id="listas"></div>
<div id="acoes"></div>
<div id="exportfb"></div>

<script>
const $ = id => document.getElementById(id);
const EMO = {instagram:'📸', facebook:'👥', tiktok:'🎵', linktree:'🔗', whatsapp:'💬'};
const tipo = u => /instagram/i.test(u) ? 'instagram' : /facebook|fb\.com/i.test(u) ? 'facebook'
  : /tiktok/i.test(u) ? 'tiktok' : /linktr\.ee/i.test(u) ? 'linktree' : /wa\.me|whatsapp/i.test(u) ? 'whatsapp' : null;
let ultimo = null;

$('f').onsubmit = async e => {
  e.preventDefault();
  $('go').disabled = true; $('erro').style.display = 'none';
  $('resumo').style.display = 'none'; $('listas').innerHTML = '';
  $('acoes').style.display = 'none'; $('exportfb').style.display = 'none';
  ultimo = null;
  $('prog').style.display = 'block'; $('plog').textContent = 'iniciando...';
  try {
    const r = await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nicho: $('nicho').value.trim(), cidade: $('cidade').value.trim()})});
    const {id, cache} = await r.json();
    if (cache) { $('plog').textContent = 'resultado em cache ⚡'; return mostrar(id); }
    const es = new EventSource(`/api/jobs/${id}/events`);
    const pesos = {inicio:5, busca:25, fichas:45, sociais:25};
    let base = 0, etapaAtual = '';
    es.onmessage = ev => {
      const d = JSON.parse(ev.data);
      if (d.etapa === 'erro') { es.close(); return falha(d.msg); }
      if (d.etapa === 'fim')  { es.close(); return mostrar(id); }
      if (d.etapa !== etapaAtual) { base += pesos[etapaAtual] || 0; etapaAtual = d.etapa; }
      const pct = base + (pesos[d.etapa] || 0) * Math.min(d.atual / (d.total || 1), 1);
      $('fill').style.width = Math.min(pct, 97) + '%';
      $('plog').textContent = `${d.etapa} · ${d.atual}/${d.total} · ${d.msg}`;
    };
    es.onerror = () => { es.close(); falha('conexão perdida'); };
  } catch (err) { falha(err.message); }
};

function falha(msg) {
  $('go').disabled = false; $('prog').style.display = 'none';
  $('erro').textContent = '⚠ ' + msg; $('erro').style.display = 'block';
}

async function mostrar(id) {
  const r = await (await fetch(`/api/jobs/${id}`)).json();
  $('go').disabled = false; $('prog').style.display = 'none';
  $('fill').style.width = '100%';
  if (r.erro) return falha(r.erro);
  ultimo = {id, ...r};
  const s = r.resumo || {};
  $('resumo').style.display = 'flex';
  $('resumo').innerHTML = `
    <div class="pill"><b>${s.com ?? 0}</b><small>✅ com redes</small></div>
    <div class="pill"><b>${s.so_site ?? 0}</b><small>🌐 só site</small></div>
    <div class="pill"><b>${s.sem ?? 0}</b><small>❌ sem nada</small></div>`;
  const g = {com:[], so_site:[], sem:[]};
  (r.lugares || []).forEach(l => g[(l.sociais && l.sociais.length) ? 'com' : l.website ? 'so_site' : 'sem'].push(l));
  const ordena = a => a.sort((x,y) => parseFloat((y.nota||'0').replace(',','.')) - parseFloat((x.nota||'0').replace(',','.')));
  const linha = l => {
    const end = (l.categoria_endereco||'').split('·').pop().trim();
    let h = `<div class="item"><b>${l.nome}${l.nota ? ` <span class="nota">⭐${l.nota}</span>` : ''}</b>`;
    if (end) h += `<div class="mut">📍 ${end}${l.tel ? ' · 📞 ' + l.tel : ''}</div>`;
    (l.sociais || []).forEach(u => h += `<div>${EMO[tipo(u)] || '🔗'} <a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'')}</a></div>`);
    if (!(l.sociais || []).length && l.website)
      h += `<div>🌐 <a href="${l.website}" target="_blank" rel="noopener">${l.website.replace(/^https?:\/\/(www\.)?/,'').slice(0,60)}</a></div>`;
    return h + '</div>';
  };
  $('listas').innerHTML = `
    <details open><summary>✅ Com redes sociais (${g.com.length})</summary>${ordena(g.com).map(linha).join('')}</details>
    <details><summary>🌐 Só site/cardápio (${g.so_site.length})</summary>${ordena(g.so_site).map(linha).join('')}</details>
    <details><summary>❌ Sem presença digital (${g.sem.length})</summary>${ordena(g.sem).map(linha).join('')}</details>`;
  $('acoes').style.display = 'flex';
  $('acoes').innerHTML = `
    <button type="button" data-fmt="md">⬇ Markdown</button>
    <button type="button" data-fmt="csv">⬇ CSV</button>`;
}

const slug = s => (s || 'relatorio').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'relatorio';
const nomeArquivo = (nicho, cidade, ext) => `prospector-${slug(nicho)}-${slug(cidade)}.${ext}`;
const titleCase = s => (s || '').replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1));
const grupos = d => {
  const g = {com:[], so_site:[], sem:[]};
  (d.lugares || []).forEach(l => g[(l.sociais && l.sociais.length) ? 'com' : l.website ? 'so_site' : 'sem'].push(l));
  return g;
};

function mdLocal(d) {
  const g = grupos(d);
  const total = g.com.length + g.so_site.length + g.sem.length;
  const L = [`# 🔎 ${titleCase(d.nicho)} em ${d.cidade} — presença digital`,
    `\n**${total} estabelecimentos** (fonte: Google Maps)\n`,
    '| Categoria | Qtde |', '|---|---|',
    `| ✅ Com redes sociais | **${g.com.length}** |`,
    `| 🌐 Só site/cardápio | ${g.so_site.length} |`,
    `| ❌ Sem nenhum link | ${g.sem.length} |`,
    `\n## ✅ Com redes sociais (${g.com.length})\n`];
  for (const l of g.com) {
    const end = (l.categoria_endereco || '').split('·').pop().trim();
    L.push(`### ${l.nome}` + (l.nota ? ` — ⭐ ${l.nota}` : ''));
    if (end) L.push(`- 📍 ${end}`);
    if (l.tel) L.push(`- 📞 ${l.tel}`);
    for (const u of (l.sociais || [])) L.push(`- ${EMO[tipo(u)] || '🔗'} ${u}`);
    L.push('');
  }
  L.push(`\n## 🌐 Só site/cardápio (${g.so_site.length})\n\n| Nome | ⭐ | Link |\n|---|---|---|`);
  for (const l of g.so_site)
    L.push(`| ${(l.nome || '').slice(0,45)} | ${l.nota || '—'} | ${(l.website || '').slice(0,70)} |`);
  L.push(`\n## ❌ Sem nenhum link (${g.sem.length})\n\n| Nome | ⭐ | Telefone |\n|---|---|---|`);
  for (const l of g.sem)
    L.push(`| ${(l.nome || '').slice(0,50)} | ${l.nota || '—'} | ${l.tel || '—'} |`);
  return L.join('\n');
}

function csvLocal(d) {
  const esc = v => {
    const s = String(v ?? '');
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const g = grupos(d);
  const rows = [['categoria','nome','nota','endereco','telefone','website','redes_sociais']];
  for (const [lista, nomeG] of [[g.com,'com_redes'],[g.so_site,'so_site'],[g.sem,'sem_nada']]) {
    for (const l of lista) {
      const end = (l.categoria_endereco || '').split('·').pop().trim();
      rows.push([nomeG, l.nome || '', l.nota || '', end, l.tel || '', l.website || '', (l.sociais || []).join(' | ')]);
    }
  }
  return '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\n');
}

function dispararDownload(nome, texto, mime) {
  const blob = new Blob([texto], {type: mime + ';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function mostrarFallback(nome, texto, apiUrl) {
  const fb = $('exportfb');
  fb.style.display = 'block';
  fb.innerHTML = `
    <div class="row">
      <span>Gerado</span> <b>${nome}</b>
      <button type="button" id="exportcopy">Copiar</button>
      <button type="button" id="exportver">Ver</button>
      <a href="${apiUrl}" target="_blank" rel="noopener" download="${nome}">Abrir</a>
    </div>
    <textarea id="exporttxt" readonly></textarea>`;
  $('exporttxt').value = texto;
  $('exportcopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(texto);
      $('exportcopy').textContent = 'Copiado';
    } catch {
      const t = $('exporttxt');
      t.style.display = 'block';
      t.select();
      document.execCommand('copy');
      $('exportcopy').textContent = 'Copiado';
    }
  };
  $('exportver').onclick = () => {
    const t = $('exporttxt');
    const on = t.style.display === 'block';
    t.style.display = on ? 'none' : 'block';
    $('exportver').textContent = on ? 'Ver' : 'Ocultar';
  };
}

$('acoes').addEventListener('click', async ev => {
  const btn = ev.target.closest('button[data-fmt]');
  if (!btn || !ultimo) return;
  const fmt = btn.dataset.fmt;
  const ext = fmt === 'csv' ? 'csv' : 'md';
  const mime = fmt === 'csv' ? 'text/csv' : 'text/markdown';
  const nome = nomeArquivo(ultimo.nicho, ultimo.cidade, ext);
  const apiUrl = `/api/jobs/${ultimo.id}/export?fmt=${ext}`;
  btn.disabled = true;
  let texto = '';
  try {
    const r = await fetch(apiUrl);
    if (r.ok) texto = await r.text();
  } catch (_) { /* gera local */ }
  if (!texto) texto = fmt === 'csv' ? csvLocal(ultimo) : mdLocal(ultimo);
  try { dispararDownload(nome, texto, mime); }
  catch (_) { /* iframe sem allow-downloads */ }
  mostrarFallback(nome, texto, apiUrl);
  btn.disabled = false;
});
</script>
</body>
</html>
